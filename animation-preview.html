<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ходьба и атаки — Галлы</title><style>*{box-sizing:border-box}body{margin:0;padding:30px;background:#111c19;color:#efe8d1;font:14px Consolas,monospace}main{max-width:1100px;margin:auto}small{color:#d7b874;letter-spacing:3px}h1{font-size:30px}p{color:#b4c4b6;line-height:1.6}.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin:22px 0}button,a{font:inherit;color:#e9ce8c}button{padding:10px 16px;background:#263c30;border:1px solid #596b50;cursor:pointer}button[aria-pressed=true]{background:#dac07e;color:#14231b}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:12px;background:#23392d;border:1px solid #465a42;text-align:center}canvas{width:192px;height:192px;image-rendering:pixelated;max-width:100%;object-fit:contain}h2{font-size:16px;margin:8px}.caption{font-size:11px;color:#b0c0ab;min-height:18px}.status{font-size:12px;color:#d6b875;margin:16px 0}input{accent-color:#dac07e}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}body{padding:16px}canvas{width:150px;height:150px}}</style><main><small>ГАЛЛЫ: ПОСЛЕДНИЙ ПИР / АНИМАЦИЯ</small><h1>Шаг. Замах. Удар.</h1><p>Изучи движения и атаки героев и легионеров.</p><div class="toolbar"><button id="walk" aria-pressed="true">Ходьба</button><button id="attack" aria-pressed="false">Атака</button><button id="hurt" aria-pressed="false">Получение урона</button><button id="pause">Пауза</button><button id="next">Следующий кадр →</button><button id="flip">Развернуть</button><label>Скорость <input id="speed" type="range" min="0.25" max="1.5" step="0.25" value="1"></label></div><div id="cards" class="cards"></div><h2>Рыба и пилум в полёте</h2><canvas id="projectiles" width="720" height="100" style="width:100%;height:100px;background:#344b34"></canvas><h2>Менгир в полёте</h2><canvas id="flight" width="720" height="160" style="width:100%;height:160px;background:#344b34"></canvas><div id="status" class="status">Загрузка кадров…</div><p><a href="index.html">ИГРАТЬ →</a></p></main><script src="projectile-art.js?v=fish-height-4"></script><script src="menhir-layout.js?v=motion-3"></script><script src="menhir-art.js?v=motion-3"></script><script src="villager-layout.js?v=motion-3"></script><script src="motion-v2-layout.js?v=motion-3"></script><script src="villager-art.js?v=motion-3"></script><script src="animation-layout.js?v=motion-3"></script><script src="animation-art.js?v=motion-3"></script><script>
const characters=[['asterix',0,'Астерикс','Удар кулаком'],['obelix',0,'Обеликс','Бросок менгира'],['roman',0,'Худой легионер','Выпад копьём'],['roman',1,'Полный солдат','Выпад копьём'],['roman',2,'Ветеран','Выпад копьём'],['boss',0,'Центурион','Удар мечом'],['cacofonix',0,'Какафоникс','Игра на лире'],['antisanitarix',0,'Антисанитарикс','Бросок рыбы'],['automatix',0,'Автоматикс','Удар молотом'],['panoramix',0,'Панорамикс','Ядовитый след']];
let action='walk',paused=false,flipped=false,phase=0,last=0,flightTime=0;
const entries=characters.map(([name,v,label,attack])=>{const card=document.createElement('div');card.className='card';card.innerHTML=`<canvas width="128" height="128"></canvas><h2>${label}</h2><div class="caption"></div>`;document.getElementById('cards').append(card);return{name,v,attack,g:card.querySelector('canvas').getContext('2d'),caption:card.querySelector('.caption')};});
for(const id of ['walk','attack','hurt'])document.getElementById(id).onclick=()=>{action=id;phase=0;for(const b of ['walk','attack','hurt'])document.getElementById(b).setAttribute('aria-pressed',b===id);};
document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'Продолжить':'Пауза';};document.getElementById('next').onclick=()=>{paused=true;document.getElementById('pause').textContent='Продолжить';phase=(Math.floor(phase*4)+1)%4/4;};document.getElementById('flip').onclick=()=>flipped=!flipped;
function frame(t){if(!paused)flightTime+=Math.min(.05,(t-last)/1000||0);const fg=document.getElementById('flight').getContext('2d');fg.clearRect(0,0,720,160);fg.imageSmoothingEnabled=false;const pg=document.getElementById('projectiles').getContext('2d');pg.clearRect(0,0,720,100);pg.imageSmoothingEnabled=false;ProjectileArt.drawFish(pg,{x:50+(flightTime%2)*140,y:58,age:flightTime,vx:1,vy:0});ProjectileArt.drawPilum(pg,{x:400+(flightTime%2)*130,y:58,vx:1,vy:0});const flight=flightTime%2.2;MenhirArt.draw(fg,{x:50+flight*280,y:105,age:flight,angle:Math.PI+flight*4.5,r:11});if(!paused)phase=(phase+Math.min(.05,(t-last)/1000||0)*Number(document.getElementById('speed').value)/(action==='walk'?.65:.8))%1;last=t;for(const e of entries){const g=e.g;g.clearRect(0,0,128,128);g.imageSmoothingEnabled=false;g.save();if(flipped){g.translate(128,0);g.scale(-1,1);}const pose=action==='hurt'&&e.name!=='roman'&&!VillagerArt.get(e.name)?'idle':action;const art=VillagerArt.get(e.name,pose,phase)||AnimationArt.get(e.name,e.v,pose,phase);if(art){if(art.width===256)g.drawImage(art,-64,-120);else g.drawImage(art,0,0);}g.restore();const f=Math.floor(phase*4);e.caption.textContent=(action==='walk'?'Шаг':action==='hurt'?(e.name==='roman'||VillagerArt.get(e.name)?'Реакция на удар':'Стойка'):e.attack)+' · '+(f+1)+'/4'+(action==='attack'&&f===2?' · УДАР':'');}document.getElementById('status').textContent=[...Object.values(AnimationArt.status),...Object.values(VillagerArt.status)].every(s=>s==='ready')?'Герои готовы к бою':'Загрузка…';requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
